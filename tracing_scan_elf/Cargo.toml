[package]
name = "tracing_scan_elf"
version = "0.1.0"
edition = "2024"

# Cargo discovers the public library and CLI in src/lib.rs and src/main.rs.
[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.4"
gimli = "0.34"
object = { version = "0.39", features = ["write"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Only the end-to-end fixture needs tracing; the scanner never executes the input.
tracing = "0.1"
