[package]
name = "tracing_table"
version = "0.1.0"
edition = "2024"

# Build the library and scanner together; keep dump generators independent.
[workspace]
members = ["tracing_scan_elf"]
default-members = [".", "tracing_scan_elf"]
# Vendored repositories retain their own upstream workspace configuration.
exclude = ["examples/bevy_capture", "examples/actix_capture", "vendor/tracing", "vendor/log"]
resolver = "3"

# Patch the tracing family together so direct and transitive users share types.
# The standalone Bevy workspace mirrors these paths in its own manifest.
[patch.crates-io]
tracing = { path = "vendor/tracing/tracing" }
tracing-core = { path = "vendor/tracing/tracing-core" }
tracing-attributes = { path = "vendor/tracing/tracing-attributes" }
log = { path = "vendor/log" }

[features]
# Default to bit compaction and vendored callsite templates for now.
default = ["bit-compression", "tracing_patched"]
# Resolve runtime templates from vendored tracing records, without scanner/source lookup.
tracing_patched = []
# Choose archived message layout at compile time; active rows and string LZ4 stay identical.
bit-compression = []
# Optional offline inspection; adds no counters or bytes to recorded blocks.
column-metrics = []

[dependencies]
# Share owned formatting recipes with the vendored tracing bridge.
introspect-fmt = { path = "introspect-fmt/introspect-fmt", features = ["nightly"] }
# Import the scanner's public types and artifact readers from root code.
tracing_scan_elf = { path = "tracing_scan_elf" }
bytemuck = { version = "1.23.0", features = ["derive"] }
parking_lot = { version = "0.12.3", features = ["arc_lock"] }
smallvec = { version = "1.15.0", features = ["const_generics"] }
streaming-iterator = "0.1.9"
tracing = "0.1.41"
tracing-core = "0.1.33"
tracing-subscriber = { version = "0.3.19", features = ["std"] }
tracing-log = "0.2.0"
rmpv = "1.3.1"
lz4_flex = "0.11"
# HC levels produce the same LZ4 blocks read by lz4_flex.
lz4 = "1"
# Buffer hashes are transient and byte equality resolves collisions.
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }

# Measurement collector has its own CLI and emits CSV rather than benchmark timings.
[[bench]]
name = "archived_storage"
harness = false

[[example]]
name = "column_metrics"
required-features = ["column-metrics"]

[dev-dependencies]
# Compare the linked test binary against independent DWARF discovery.
object = "0.39"
# Exercise log macros redirected into native tracing records by the vendor patch.
log = "0.4"
